[package]
name = "dsh-control-panel"
version = "2.2.1"
description = "DSH Control Panel — install, update, launch and maintain DeepSeek Harness"
authors = ["DSH Control Panel"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dsh_control_panel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = "0.4"
sys-locale = "0.3"
semver = "1"
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2", "https"] }
